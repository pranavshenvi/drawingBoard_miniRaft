version: "3"

services:

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - replica1
      - replica2
      - replica3
    networks:
      raftnet:
        ipv4_address: 172.28.0.10
    environment:
      - REPLICA1_URL=http://replica1:5001
      - REPLICA2_URL=http://replica2:5002
      - REPLICA3_URL=http://replica3:5003

  replica1:
    build: ./replica
    container_name: replica1
    command: node server.js
    environment:
      - NODE_ID=1
      - PORT=5001   # ✅ FIX
    ports:
      - "5001:5001"
    networks:
      raftnet:
        ipv4_address: 172.28.0.2

  replica2:
    build: ./replica
    container_name: replica2
    command: node server.js
    environment:
      - NODE_ID=2
      - PORT=5002   # ✅ FIX
    ports:
      - "5002:5002"
    networks:
      raftnet:
        ipv4_address: 172.28.0.3

  replica3:
    build: ./replica
    container_name: replica3
    command: node server.js
    environment:
      - NODE_ID=3
      - PORT=5003   # ✅ FIX
    ports:
      - "5003:5003"
    networks:
      raftnet:
        ipv4_address: 172.28.0.4

networks:
  raftnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16